<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면접 연습</title>
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .home{text-align:center;padding:16px;width:100%;max-width:560px}
  #dday{color:var(--dim);font-size:14px;margin-bottom:28px;letter-spacing:.5px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .mode{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--text);font-size:20px;font-weight:700;transition:border-color .15s,transform .15s}
  .mode:hover{border-color:var(--accent);transform:translateY(-2px)}
  .mode span{font-size:40px}
</style>
</head>
<body>
<div class="home">
  <div id="dday"></div>
  <div class="btns">
    <a class="mode" href="practice.html"><span>🎧</span>연습모드</a>
    <a class="mode" href="interview.html"><span>🎥</span>실전모드</a>
  </div>
</div>
<script>
  // 면접 이름·날짜는 연습모드 [면접 이름·날짜]에서 설정 (questions.json의 meta)
  fetch("questions.json", { cache: "no-store" }).then(r => r.json()).then(({ meta = {} }) => {
    const el = document.getElementById("dday"), t = meta.title || "면접 연습";
    if (!meta.date) { el.textContent = t; return }
    const d = Math.ceil((new Date(meta.date + "T00:00:00") - new Date()) / 864e5);
    el.textContent = `${t} ` + (d > 0 ? `D-${d}` : d === 0 ? "D-DAY" : "진행 중");
  }).catch(() => document.getElementById("dday").textContent = "연습시작.command로 열어 주세요");
</script>
</body>
</html>
